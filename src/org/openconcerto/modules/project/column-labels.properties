# Libelles de colonnes par defaut du module project (embarques dans le jar).
#
# Utilisation : ce fichier fournit les libelles d'une NOUVELLE installation.
# Ce que la personne qui a le plus de droits enregistre depuis
# « Parametres > Libelles des colonnes » est stocke en base, dans la table
# PROJECT_COLUMN_LABEL, et reste PRIORITAIRE sur ce fichier.
#
# Format : CLE=LIBELLE, avec CLE = TABLE.COLONNE (table « * » = toutes les tables).
# Le mode vaut AUTO (suppression automatique du prefixe ID_), MAPPING (uniquement
# les regles ci-dessous) ou OFF (aucun changement).
#
# Les libelles automatiques (ID_CLIENT -> CLIENT) n'ont pas besoin d'etre listes :
# le mode AUTO s'en charge. Ne mettre ici que les exceptions.

mode=AUTO
