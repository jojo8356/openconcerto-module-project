name: Sonde SQL (temporaire)
on:
  push:
    branches: [arena/ff79607f-openconcerto-module-project]
jobs:
  helper:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: openconcerto }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Fixture du module puis la requete d'audit
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: pw, PGDATABASE: openconcerto }
        run: |
          set -e
          python3 tools/oc_sql_sqlite.py --emit-fixture --line-columns all --devis-key ID_DEVIS > /tmp/fix.sql
          psql -q -f /tmp/fix.sql
          echo "--- colonnes de COMMANDE ---"
          psql -tAc "select string_agg(column_name, ', ') from information_schema.columns where table_schema='OpenConcerto42' and table_name='COMMANDE'"
          echo "--- execution du fichier ---"
          psql -f sql/derniere-commande-fournisseur.sql > /tmp/out.log 2>&1 || true
          cat /tmp/out.log | tail -n 40
          if grep -qi "^ERREUR\\|^ERROR" /tmp/out.log; then
            grep -n "ERREUR\\|ERROR" /tmp/out.log | head -n 5 | sed 's/^/::error::/'
            exit 1
          fi
          echo "OK : aucune erreur SQL"
