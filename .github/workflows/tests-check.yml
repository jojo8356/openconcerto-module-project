name: Tests (temporaire, resultat dans le depot)

# Workflow TEMPORAIRE : les journaux GitHub Actions ne sont pas lisibles depuis
# l'environnement de travail, on ecrit donc la sortie des tests dans un fichier
# du depot, puis on supprime ce workflow.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Regles testables (sans OpenConcerto.jar)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Lancer les tests
        run: |
          set +e
          chmod +x scripts/*.sh
          sh scripts/run-tests.sh > build-tests.txt 2>&1
          echo "exit=$?" >> build-tests.txt
          tail -40 build-tests.txt

      - name: Publier le resultat dans le depot
        run: |
          git config user.name "arena-ci"
          git config user.email "arena-ci@users.noreply.github.com"
          git add build-tests.txt
          git commit -m "CI: resultat des tests (temporaire)" || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
