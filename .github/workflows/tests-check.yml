name: Tests (temporaire, resultat dans le depot)

# Workflow TEMPORAIRE : les journaux GitHub Actions ne sont pas lisibles depuis
# l'environnement de travail, on ecrit donc la sortie dans des fichiers du depot.
# Il est supprime avant la release.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    name: Tests + compilation du module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache de la distribution OpenConcerto
        uses: actions/cache@v4
        with:
          path: build/openconcerto-dist
          key: openconcerto-1.7.6-multiposte
      - name: Lancer les tests
        run: |
          set +e
          chmod +x scripts/*.sh
          sh scripts/run-tests.sh > build-tests.txt 2>&1
          echo "exit=$?" >> build-tests.txt
          tail -40 build-tests.txt
      - name: Compiler le module (jar 1.1)
        run: |
          set +e
          sh scripts/build-jar-with-curl.sh > build-compile.txt 2>&1
          echo "exit=$?" >> build-compile.txt
          tail -60 build-compile.txt
      - name: Publier les resultats dans le depot
        run: |
          git config user.name "arena-ci"
          git config user.email "arena-ci@users.noreply.github.com"
          git add build-tests.txt build-compile.txt
          git commit -m "CI: resultats (temporaire)" || true
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
