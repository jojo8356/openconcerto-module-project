name: Verification temporaire (branche de travail)
on:
  push:
    branches: [arena/ff79607f-openconcerto-module-project]
jobs:
  cli-affaire:
    name: Tests en ligne de commande
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: openconcerto, POSTGRES_DB: openconcerto }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "8" }
      - name: Tests en ligne de commande (sans base)
        run: sh scripts/test-affaire-cli.sh
      - name: Suites unitaires
        run: sh scripts/run-tests.sh
      - name: Installer le client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Reprise complete sur PostgreSQL 16 (les 7 fichiers, dans l'ordre)
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: openconcerto, PGDATABASE: openconcerto }
        run: |
          set -e
          sh scripts/oc-sql-file.sh --postgres > /tmp/pg.log 2>&1 || { tail -n 25 /tmp/pg.log; echo "::error::scenario PostgreSQL en echec"; exit 1; }
          echo "--- reprise des lignes (blocs independants) ---"
          psql -q -c 'drop schema if exists "OpenConcerto42" cascade' >/dev/null 2>&1 || true
          echo ok
