name: Verification temporaire (branche de travail)
on:
  push:
    branches:
      - arena/ff79607f-openconcerto-module-project
jobs:
  cli-affaire:
    name: Tests en ligne de commande
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: openconcerto
          POSTGRES_DB: openconcerto
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Tests en ligne de commande (sans base)
        run: sh scripts/test-affaire-cli.sh
      - name: Suites unitaires existantes
        run: sh scripts/run-tests.sh
      - name: Installer le client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Fichiers SQL sur PostgreSQL
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: openconcerto, PGDATABASE: openconcerto }
        run: |
          set +e
          sh scripts/oc-sql-file.sh --postgres > /tmp/pg.log 2>&1
          code=$?
          cat /tmp/pg.log
          if [ "$code" -ne 0 ]; then
            grep -nE "ECHEC|ERROR|ERREUR|Controles|psql:" /tmp/pg.log | tail -n 25 | sed 's/^/::error::/' || true
            exit "$code"
          fi
