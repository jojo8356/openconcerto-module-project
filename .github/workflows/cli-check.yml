name: Verification temporaire (branche de travail)
on:
  push:
    branches: [arena/ff79607f-openconcerto-module-project]
jobs:
  cli-affaire:
    name: Tests en ligne de commande
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: openconcerto, POSTGRES_DB: openconcerto }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "8" }
      - name: Tests en ligne de commande (sans base)
        run: |
          set -e
          sh scripts/test-affaire-cli.sh 2>&1 | tee /tmp/cli.log
          grep -q "aucune table citee avant sa jointure" /tmp/cli.log \
            || { echo "::error::le controle de portee n'a pas tourne"; exit 1; }
          grep -q "Controles : 85 | echecs : 0" /tmp/cli.log \
            || { echo "::error::les 85 controles SQL ne sont pas tous verts"; grep -E "ECHEC|Controles" /tmp/cli.log | tail -n 20; exit 1; }
      - name: Suites unitaires, avec preuve que les nouveaux tests tournent
        run: |
          set -e
          sh scripts/run-tests.sh 2>&1 | tee /tmp/unit.log
          report=$(grep -Eo "AffairRepairReportTest : [0-9]+ controles, 0 echec" /tmp/unit.log || echo absent)
          backfill=$(grep -Eo "AffairBackfillSupportTest : [0-9]+ tests OK" /tmp/unit.log || echo absent)
          echo "report   : $report"
          echo "backfill : $backfill"
          [ "$report" = "AffairRepairReportTest : 31 controles, 0 echec" ] \
            || { echo "::error::AffairRepairReportTest attendu 31, obtenu : $report"; exit 1; }
          [ "$backfill" = "AffairBackfillSupportTest : 73 tests OK" ] \
            || { echo "::error::AffairBackfillSupportTest attendu 73, obtenu : $backfill"; exit 1; }
      - name: Installer le client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Fichiers SQL sur PostgreSQL
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: openconcerto, PGDATABASE: openconcerto }
        run: |
          set +e
          sh scripts/oc-sql-file.sh --postgres > /tmp/pg.log 2>&1
          code=$?
          tail -5 /tmp/pg.log
          if [ "$code" -ne 0 ]; then
            grep -nE "ECHEC|ERROR|ERREUR|psql:" /tmp/pg.log | tail -n 20 | sed 's/^/::error::/' || true
            exit "$code"
          fi
