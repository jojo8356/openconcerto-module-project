name: Sonde SQL (temporaire)
on:
  push:
    branches: [arena/ff79607f-openconcerto-module-project]
jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: openconcerto }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Correctif ID_COMMANDE_ELEMENT, de bout en bout
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: pw, PGDATABASE: openconcerto }
        run: |
          set -e
          python3 tools/oc_sql_sqlite.py --emit-fixture --line-columns all --devis-key ID_DEVIS > /tmp/fix.sql
          psql -q -f /tmp/fix.sql
          echo "--- AVANT : le controle doit dire ABSENTE ---"
          psql -q -f sql/controle-affaire-complet.sql > /tmp/avant.log 2>&1 || true
          grep -A2 "id_commande_element" /tmp/avant.log | head -n 3
          grep -q "ABSENTE" /tmp/avant.log || { echo "::error::le controle ne detecte pas l absence"; exit 1; }
          echo "--- APPLICATION DU CORRECTIF ---"
          psql -v ON_ERROR_STOP=1 -f sql/fix-facture-fournisseur-element-id-commande-element.sql
          echo "--- APRES : le controle doit dire presente ---"
          psql -q -f sql/controle-affaire-complet.sql > /tmp/apres.log 2>&1 || true
          grep -A2 "id_commande_element" /tmp/apres.log | head -n 3
          grep -q "presente" /tmp/apres.log || { echo "::error::le correctif n a pas rendu la colonne visible"; exit 1; }
          echo "--- RELANCE (idempotence) ---"
          psql -q -v ON_ERROR_STOP=1 -f sql/fix-facture-fournisseur-element-id-commande-element.sql && echo "OK idempotent"
          echo "SUCCES : correctif applique puis relance sans erreur"
