name: Sonde SQL (temporaire)
on:
  push:
    branches: [arena/ff79607f-openconcerto-module-project]
jobs:
  probe:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: pw, POSTGRES_DB: openconcerto }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: factures-affaire-liens sur PostgreSQL 16
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: pw, PGDATABASE: openconcerto }
        run: |
          set -e
          python3 tools/oc_sql_sqlite.py --emit-fixture --line-columns all --devis-key ID_DEVIS > /tmp/fix.sql
          psql -q -f /tmp/fix.sql
          psql -q -c "alter table \"OpenConcerto42\".\"COMMANDE\" add column if not exists \"T_HT\" bigint default 0, add column if not exists \"T_TTC\" bigint default 0"
          psql -q -c "alter table \"OpenConcerto42\".\"FACTURE_FOURNISSEUR\" add column if not exists \"T_HT\" bigint default 0, add column if not exists \"T_TTC\" bigint default 0"
          psql -q -c "update \"OpenConcerto42\".\"AFFAIRE\" set \"NUMERO\"='12197' where \"ID\"=11870"
          psql -q -c "update \"OpenConcerto42\".\"COMMANDE\" set \"ID_AFFAIRE\"=11870, \"T_HT\"=104000, \"T_TTC\"=124800 where \"ID\"=251"
          psql -q -c "update \"OpenConcerto42\".\"FACTURE_FOURNISSEUR\" set \"ID_AFFAIRE\"=11870, \"T_HT\"=104000, \"T_TTC\"=124800 where \"ID\"=900"
          psql -f sql/factures-affaire-liens.sql > /tmp/out.log 2>&1 || true
          cat /tmp/out.log
          if grep -qi "^ERREUR\|^ERROR" /tmp/out.log; then
            grep -ni "ERREUR\|ERROR" /tmp/out.log | head -n 5 | sed 's/^/::error::/'
            exit 1
          fi
          echo "OK : aucune erreur SQL"
