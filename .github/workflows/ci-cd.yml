name: CI/CD Java

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }}) / Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java: "8"
            distribution: zulu
          - os: windows-latest
            java: "8"
            distribution: zulu
          - os: macos-latest
            java: "8"
            distribution: zulu
          - os: ubuntu-latest
            java: "21"
            distribution: temurin
          - os: windows-latest
            java: "21"
            distribution: temurin
          - os: macos-latest
            java: "21"
            distribution: temurin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}

      - name: Build module
        shell: bash
        env:
          OPENCONCERTO_JAR: /opt/openconcerto/OpenConcerto.jar
        run: |
          chmod +x scripts/build-java8-compatible.sh
          if [ ! -f "$OPENCONCERTO_JAR" ]; then
            echo "::warning::OpenConcerto jar not found at $OPENCONCERTO_JAR. Build ignored in CI."
            echo "Configure OPENCONCERTO_JAR in the repository environment or install it at that path."
            exit 0
          fi
          ./scripts/build-java8-compatible.sh

  affaire-fournisseur:
    name: Tests « affaire » des documents fournisseurs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer pglite
        run: npm install --no-audit --no-fund --silent

      # Java (regles de rattachement) + PostgreSQL embarque (pglite) :
      # aucun OpenConcerto.jar n'est necessaire.
      - name: Suite complete (Java + SQL + scenario + mutations)
        run: sh scripts/test-affaire-fournisseur.sh

  cli-affaire:
    name: Tests en ligne de commande (rattachement d'affaire)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: openconcerto
          POSTGRES_DB: openconcerto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      # 1 a 4 : compilation des tests, scenario de transfert, plan de reprise
      # execute dans SQLite, puis les vrais fichiers sql/*.sql.
      - name: Tests en ligne de commande (sans base)
        run: sh scripts/test-affaire-cli.sh

      - name: Installer le client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # 5 : les memes fichiers SQL, mais sur un vrai PostgreSQL.
      - name: Fichiers SQL sur PostgreSQL
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: openconcerto
          PGDATABASE: openconcerto
        run: sh scripts/oc-sql-file.sh --postgres

      # 6 a 12 : le script que lance le client, de bout en bout, sur une base de
      # test fraiche. Une etape par assertion : en cas d'echec, le nom de
      # l'etape dit laquelle. Chaque etape publie la sortie en annotation
      # (::error::) pour que l'echec soit lisible sans les journaux.
      - name: "Correctif - base de test fraiche"
        env: &pgci
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: openconcerto
          PGDATABASE: openconcerto
        run: |
          set -eu
          dump() { awk '{gsub(/%/,"%25");gsub(/\r/,"");printf "%s%%0A",$0}' "$1"; }
          psql -d openconcerto -v ON_ERROR_STOP=1 -q -c 'DROP SCHEMA IF EXISTS "OpenConcerto42" CASCADE'
          python3 tools/oc_sql_sqlite.py --emit-fixture --line-columns all --devis-key ID_DEVIS \
            > /tmp/fixture.sql
          psql -d openconcerto -v ON_ERROR_STOP=1 -q < /tmp/fixture.sql > /tmp/step.log 2>&1 || {
            echo "::error::Echec du chargement de la base de test: $(dump /tmp/step.log)"; exit 1; }
          echo "OK : schema de test charge"

      - name: "Correctif - colonne absente au depart"
        env: *pgci
        run: |
          set -u
          dump() { awk '{gsub(/%/,"%25");gsub(/\r/,"");printf "%s%%0A",$0}' "$1"; }
          set +e
          bash scripts/fix-facture-fournisseur-element.sh --check -d openconcerto \
            > /tmp/step.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "::error::--check devait sortir en 3 (colonne absente), code obtenu $code: $(dump /tmp/step.log)"
            exit 1
          fi
          echo "OK : colonne absente, code 3"

      - name: "Correctif - application (sauvegarde, correctif, verification, dump)"
        env: *pgci
        run: |
          set -eu
          dump() { awk '{gsub(/%/,"%25");gsub(/\r/,"");printf "%s%%0A",$0}' "$1"; }
          rm -rf /tmp/oc-fix
          bash scripts/fix-facture-fournisseur-element.sh -d openconcerto -y -o /tmp/oc-fix \
            > /tmp/step.log 2>&1 || {
            echo "::error::Echec du script de correctif: $(dump /tmp/step.log)"; exit 1; }
          grep -q 'OK : la colonne est en place' /tmp/step.log || {
            echo "::error::Le script n'a pas confirme la colonne: $(dump /tmp/step.log)"; exit 1; }
          echo "OK : correctif applique"

      - name: "Correctif - sauvegarde et dump non vides"
        env: *pgci
        run: |
          set -eu
          for f in /tmp/oc-fix/backup_avant_fix_*.dumpsql /tmp/oc-fix/OpenConcerto-1.7.6-a-jour_*.dumpsql; do
            if [ ! -s "$f" ]; then echo "::error::Fichier vide ou absent : $f"; ls -l /tmp/oc-fix; exit 1; fi
            echo "OK : $f ($(wc -c < "$f") octets)"
          done

      - name: "Correctif - colonne presente"
        env: *pgci
        run: |
          set -eu
          dump() { awk '{gsub(/%/,"%25");gsub(/\r/,"");printf "%s%%0A",$0}' "$1"; }
          bash scripts/fix-facture-fournisseur-element.sh --check -d openconcerto \
            > /tmp/step.log 2>&1 || {
            echo "::error::--check devrait voir la colonne: $(dump /tmp/step.log)"; exit 1; }
          grep -q 'colonne presente' /tmp/step.log || {
            echo "::error::Sortie inattendue: $(dump /tmp/step.log)"; exit 1; }
          echo "OK : colonne presente"

      - name: "Correctif - relance sans effet (idempotence)"
        env: *pgci
        run: |
          set -eu
          dump() { awk '{gsub(/%/,"%25");gsub(/\r/,"");printf "%s%%0A",$0}' "$1"; }
          rm -rf /tmp/oc-fix-2
          bash scripts/fix-facture-fournisseur-element.sh -d openconcerto -y -o /tmp/oc-fix-2 \
            > /tmp/step.log 2>&1 || {
            echo "::error::La relance a echoue: $(dump /tmp/step.log)"; exit 1; }
          grep -q 'rien à modifier' /tmp/step.log || {
            echo "::error::La relance aurait du etre sans effet: $(dump /tmp/step.log)"; exit 1; }
          if ls /tmp/oc-fix-2/backup_avant_fix_* >/dev/null 2>&1; then
            echo "::error::Une 2e sauvegarde a ete faite alors que rien ne changeait"
            exit 1
          fi
          echo "OK : relance sans effet"

      - name: "Correctif - lien ligne de facture -> ligne de commande"
        env: *pgci
        run: |
          set -eu
          dump() { awk '{gsub(/%/,"%25");gsub(/\r/,"");printf "%s%%0A",$0}' "$1"; }
          psql -d openconcerto -v ON_ERROR_STOP=1 -q -c \
            'UPDATE "OpenConcerto42"."FACTURE_FOURNISSEUR_ELEMENT" SET "ID_COMMANDE_ELEMENT" = 5000 WHERE "ID" = 5100' \
            > /tmp/step.log 2>&1 || {
            echo "::error::Le lien n a pas pu etre ecrit: $(dump /tmp/step.log)"; exit 1; }
          psql -d openconcerto -v ON_ERROR_STOP=1 -tA -c \
            'SELECT count(*) FROM "OpenConcerto42"."FACTURE_FOURNISSEUR_ELEMENT" WHERE "ID_COMMANDE_ELEMENT" = 5000' \
            | grep -qx 1 || { echo "::error::Le lien n a pas ete enregistre"; exit 1; }
          if psql -d openconcerto -v ON_ERROR_STOP=1 -q -c \
               'UPDATE "OpenConcerto42"."FACTURE_FOURNISSEUR_ELEMENT" SET "ID_COMMANDE_ELEMENT" = 424242 WHERE "ID" = 5100' \
               > /tmp/step.log 2>&1; then
            echo "::error::La cle etrangere accepte une ligne de commande inexistante"
            exit 1
          fi
          echo "OK : lien ecrit, cle etrangere appliquee"
